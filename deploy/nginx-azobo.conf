# Front the MCP server with TLS. Streamable-HTTP needs no buffering + long timeouts.
server {
    listen 443 ssl;
    server_name azobo.example.com;            # <-- your FQDN
    ssl_certificate     /etc/nginx/ssl/azobo.crt;
    ssl_certificate_key /etc/nginx/ssl/azobo.key;
    location / {
        proxy_pass         http://127.0.0.1:8782;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header         X-Accel-Buffering no;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
    }
}

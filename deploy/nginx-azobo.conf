# Front the MCP server with TLS. Streamable-HTTP needs no buffering + long timeouts.
# TLS is load-bearing here: the user's bearer token rides every request.

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name azobo.example.com;            # <-- your FQDN
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name azobo.example.com;            # <-- your FQDN
    ssl_certificate     /etc/nginx/ssl/azobo.crt;
    ssl_certificate_key /etc/nginx/ssl/azobo.key;

    # TLS hardening.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:azobo:10m;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Graph POST bodies (and large az inputs) can exceed nginx's 1 MB default.
    client_max_body_size 8m;

    location / {
        proxy_pass         http://127.0.0.1:8782;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header         X-Accel-Buffering no;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
    }
}
